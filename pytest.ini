[pytest]
testpaths = tests
# Run with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1: the ROS Jazzy pytest plugins on PYTHONPATH
# (launch_testing, launch_testing_ros) are incompatible with pytest >= 8.
markers =
    slow: multi-second closed-loop replan simulations
    ros: spawns ROS 2 nodes (needs a sourced workspace); skip with -m "not ros"
